name: 条文と規約の見張り

# 週に一度（水曜）、研究の側が拠る条文と規約を取り寄せ直し、記した値と比べる（tools/statutes.js）。
# 一つ目は、このリポジトリの頁が引く条文（e-Gov 法令 API）と GitHub の利用規約（github/site-policy）。
# 二つ目は、cpsbvbng26-dotcom の verification/statutes.json の写し（verification/canonical-statutes.json）。
# 写しは、正本の main を読むだけで照らし、条文は e-Gov 法令 API から、GitHub にある規約はそのファイルの最後のコミットから取り寄せ直す。
# 違えば、このリポジトリに、決まった語だけの issue を一つ開くか直し、元に戻れば閉じる。ほかのリポジトリには書かない。
# リポジトリには何も書かない。記し直すのは、PR のコミットで行う。
# 月曜は Sophaxis、火曜と木曜はほかのリポジトリの見張りが回るので、水曜にする。
# PR では比べて表示するだけ。issue に書く権限は持たない。
on:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
  pull_request:
    paths: ['tools/statutes.js', 'verification/statutes.json', 'verification/statutes-texts.json', 'verification/canonical-statutes.json', '.github/workflows/statutes.yml']

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'pull_request'
    name: 条文と規約が記した値と同じか（比べるだけ）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/statutes.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: 条文と規約が記した値と同じか
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: statutes
      cancel-in-progress: false
    # 書くのは、このリポジトリの issue だけ。
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/statutes.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
