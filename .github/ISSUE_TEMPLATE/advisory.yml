name: 諮問委員への申し出 / Advisory board
description: Sophaxis のほかのサイトとリポジトリへの助言を、公開の場で申し出る。報酬は無く、費用もかからない / Offer in public to advise on the operator's sites and repositories other than Sophaxis. Unpaid, and no fee
title: "諮問: "
labels: ["諮問"]
body:
  - type: markdown
    attributes:
      value: |
        この issue は公開されます。本名・住所・連絡先は書かない形にしています。公開の場で申し出たくないときは、運営者の ORCID の記録にあるメールアドレスで申し出ることができます。https://orcid.org/0009-0000-1406-0547
        Sophaxis の諮問委員には、この様式ではなく、Sophaxis の募集の手順で申し出ます。https://github.com/cpsbvbng26-dotcom/sophaxis/blob/main/advisory.ja.md
        加われる人と、助言の範囲は、諮問委員の募集にあります。助言に報酬は無く、雇用ではなく、助言は何も決めません。名を挙げる前に利害を申告します。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/advisory.md
        16 歳未満の人の申し出は受けません。18 歳未満の人の申し出は、親または保護者の同意があるときに限って受けます。
        書いたものは、この申し出に答えることと、委員を選ぶことにだけ使います。扱いは個人情報の取り扱いにあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.md
        This issue is public. The form asks that no real name, address or contact details be written. An offer can also be made by email, at the address on the operator's ORCID record. https://orcid.org/0009-0000-1406-0547
        An offer to advise Sophaxis is made under the call of Sophaxis, not through this form. https://github.com/cpsbvbng26-dotcom/sophaxis/blob/main/advisory.md
        Who can join, and the scope of advice, are in Advisory board. Advice is unpaid, is not employment and decides nothing. Interests are declared before an adviser is named. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/advisory.en.md
        An offer from a person under 16 years of age is not accepted. An offer from a person under 18 years of age is accepted only with the consent of a parent or guardian.
        What is written is used only to answer this offer and to choose advisers. The handling is in Personal data. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.en.md
  - type: input
    id: orcid
    attributes:
      label: ORCID iD
      description: 公開の ORCID の記録の iD / The iD of a public ORCID record
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 分野 / Field
      options:
        - 哲学 / Philosophy
        - 数学 / Mathematics
        - 論理学 / Logic
        - 数理哲学 / Philosophy of mathematics
        - 科学哲学 / Philosophy of science
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 助言したい理由 / Why
      description: 一文で足ります / A sentence is enough
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確かめたこと / Confirmation
      options:
        - label: 諮問委員の募集の「加われる人」に当たることを確かめました。 / I have checked that I meet "Who can join" in Advisory board.
          required: true
        - label: 16 歳以上であり、18 歳未満なら親または保護者の同意があります。 / I am 16 years of age or older, and, if under 18 years of age, have the consent of a parent or guardian.
          required: true
        - label: 助言に報酬は無く、雇用ではなく、助言は何も決めないことを読みました。 / I have read that advice is unpaid, is not employment and decides nothing.
          required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 言語モデルに渡ること（任意） / Use of a language model (optional)
      description: |
        運営者は、このリポジトリの作業を Claude Code で行います。欄に印があれば、この issue の題と本文は、申し出を扱う手助けのために、Anthropic（米国）の言語モデル Claude に渡ることがあります。運営者は、これを個人情報保護法第28条の外国にある第三者への提供として扱います。米国の制度と Anthropic の措置は、個人情報の取り扱いの「外国にある第三者について知らせること」の節にあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.md
        印は任意です。印が無ければ、運営者は、Claude にもほかの言語モデルにも渡さずに申し出を扱います。印が無くても、申し出の扱いは変わりません。この issue のコメントは、言語モデルに渡しません。同意は、この issue で、いつでも撤回できます。
        The operator works on this repository with Claude Code. If the box is ticked, the title and text of this issue may be given to Claude, the language model of Anthropic (United States), to help handle the offer. The operator treats this as a provision of personal data to a third party in a foreign country under Article 28 of Japan's Act on the Protection of Personal Information. The system of the United States and Anthropic's measures are in the section "Information on the third party in a foreign country" of Personal data. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.en.md
        The box is optional. Without it, the operator handles the offer without giving it to Claude or any other language model, and the offer is handled in the same way. Comments on this issue are not given to a language model. The consent can be withdrawn at any time in this issue.
      options:
        - label: この issue の題と本文を、運営者が Claude（Anthropic、米国）に渡すことに同意します。 / I consent to the operator giving the title and text of this issue to Claude (Anthropic, United States).
          required: false
