name: 修正と削除の求め / Requests
description: 運営者のサイトとリポジトリの記載の訂正や削除、権利の侵害の知らせ、同意の撤回などを、公開の場で求める。無償 / Ask in public for the correction or removal of an entry, give notice of an infringement, or withdraw a consent, on the operator's sites and repositories. No fee
title: "求め: "
labels: ["求め"]
body:
  - type: markdown
    attributes:
      value: |
        この issue は公開されます。本名・住所・連絡先と、問題の個人情報そのものは書かない形にしています。どこにあるかだけを書く形です。
        個人の情報を含む求めは、この様式ではなく、運営者の ORCID の記録にあるメールアドレスで受けます。https://orcid.org/0009-0000-1406-0547 連絡先を公開しなくても、メールで答えを受け取れます。
        Sophaxis の記録についての求めは、Sophaxis の様式で受けます。様式は、削除 https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=removal.yml 、撤回 https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=withdrawal.yml 、訂正 https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=correction.yml 、権利者の知らせ https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=rights-ja.yml です。
        公開物の誤りは、そのリポジトリの誤りの知らせの様式で受けます。様式の場所は法務の索引にあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/index.md
        書いたものは、この求めに答えることと、そのリポジトリの手続きに沿って扱うことにだけ使います。扱いは個人情報の取り扱いにあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.md
        費用はかかりません。手順は修正と削除の求めにあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/requests.md
        This issue is public. The form asks that no real name, address or contact details, and not the personal data itself, be written; only where it is.
        A request that contains personal information is received by email, not through this form, at the address on the operator's ORCID record. https://orcid.org/0009-0000-1406-0547 The answer comes by email, with no need to make a contact public.
        A request about a record on Sophaxis is received through the forms of Sophaxis: removal https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=removal.yml , withdrawal https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=withdrawal.yml , correction https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=correction.yml and rights holder's notice https://github.com/cpsbvbng26-dotcom/sophaxis/issues/new?template=rights.yml .
        An error in a published work is received through the error report form of its repository. The forms are listed in the Legal index. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/index.en.md
        What is written is used only to answer this request and to handle it under the procedure of the repository concerned. The handling is in Personal data. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.en.md
        There is no fee. The procedure is in Requests. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/requests.en.md
  - type: dropdown
    id: repo
    attributes:
      label: どのリポジトリか / Which repository
      options:
        - cpsbvbng26-dotcom
        - errata-check
        - self-correction
        - trinity-infinity
        - trinity-operator
        - autonomy-and-self-cultivation
        - naval-gazette-notes
        - researcher-profile
        - justice-and-algorithms
        - solitary-school
        - deposit-check
        - research-collaboration
        - golden-window-resolution
        - legal-and-governance
        - 分からない / Not sure
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 求めの種類 / Kind of request
      options:
        - 人についての記載の訂正・削除（個人の情報を含まないもの） / Correction or removal of a statement about a person (without personal information)
        - 人についての記載でない権利の侵害の知らせ / Notice of an infringement that does not concern a statement about a person
        - 言語モデルに渡すことへの同意の撤回 / Withdrawal of consent to giving an issue to a language model
        - そのほかの訂正・削除の求め / Another request for correction or removal
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: どこにあるか / Where
      description: ファイルの名と行、頁の URL、issue の番号。個人情報そのものは書かない形にしています / A file name and line, the URL of a page, or an issue number. The personal data itself is not written
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何を求めるか / What is asked
      description: 短くてかまいません。権利の侵害の知らせなら、どの権利かを書く形です。素材そのものは書き写さない形にしています / Short is fine. For a notice of an infringement, the right concerned. The material itself is not copied
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 言語モデルに渡ること（任意） / Use of a language model (optional)
      description: |
        運営者は、このリポジトリの作業を Claude Code で行います。欄に印があれば、この issue の題と本文は、求めを扱う手助けのために、Anthropic（米国）の言語モデル Claude に渡ることがあります。運営者は、これを個人情報保護法第28条の外国にある第三者への提供として扱います。米国の制度と Anthropic の措置は、個人情報の取り扱いの「外国にある第三者について知らせること」の節にあります。https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.md
        印は任意です。印が無ければ、運営者は、Claude にもほかの言語モデルにも渡さずに求めを扱います。印が無くても、求めの扱いは変わりません。この issue のコメントは、言語モデルに渡しません。同意は、この issue で、いつでも撤回できます。
        The operator works on this repository with Claude Code. If the box is ticked, the title and text of this issue may be given to Claude, the language model of Anthropic (United States), to help handle the request. The operator treats this as a provision of personal data to a third party in a foreign country under Article 28 of Japan's Act on the Protection of Personal Information. The system of the United States and Anthropic's measures are in the section "Information on the third party in a foreign country" of Personal data. https://github.com/cpsbvbng26-dotcom/legal-and-governance/blob/main/pages/privacy.en.md
        The box is optional. Without it, the operator handles the request without giving it to Claude or any other language model, and the request is handled in the same way. Comments on this issue are not given to a language model. The consent can be withdrawn at any time in this issue.
      options:
        - label: この issue の題と本文を、運営者が Claude（Anthropic、米国）に渡すことに同意します。 / I consent to the operator giving the title and text of this issue to Claude (Anthropic, United States).
          required: false
